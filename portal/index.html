<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智能风控 · 入口</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: radial-gradient(1200px 600px at 20% 0%, #eef4ff 0%, #f7f9fc 45%, #f2f4f8 100%); color: #1f2d3d; }
  .wrap { width: min(880px, 92vw); }
  .brand { text-align: center; margin-bottom: 28px; }
  .brand h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: 0.5px; }
  .brand p { margin: 0; color: #5b6b80; font-size: 14px; }
  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 640px) { .roles { grid-template-columns: 1fr; } }
  .role { display: block; text-decoration: none; color: inherit; background: #fff; border: 1px solid #e2e9f3;
          border-radius: 16px; padding: 26px 24px; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  .role:hover { transform: translateY(-2px); border-color: #c7d5ea; box-shadow: 0 10px 26px rgba(31,45,61,.08); }
  .role .icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; margin-bottom: 14px; }
  .role.borrower .icon { background: #eaf1ff; }
  .role.banker .icon { background: #eaf7ef; }
  .role h2 { margin: 0 0 6px; font-size: 18px; }
  .role p { margin: 0 0 16px; color: #5b6b80; font-size: 13px; line-height: 1.6; }
  .role .go { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #2c5cb8; font-weight: 600; }
  .foot { margin-top: 22px; text-align: center; color: #8a97a8; font-size: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <h1>智能风控 · 银行流水核验</h1>
      <p>请选择身份进入对应入口</p>
    </div>
    <div class="roles">
      <a class="role borrower" href="/app/">
        <div class="icon">&#128196;</div>
        <h2>借款侧</h2>
        <p>上传个人银行流水，查看解析结果与真实性校验结论。</p>
        <span class="go">进入借款侧 &rarr;</span>
      </a>
      <a class="role banker" href="/bank/">
        <div class="icon">&#127974;</div>
        <h2>银行侧</h2>
        <p>审批工作台：流水列表、报告复核、模板与风控参数。</p>
        <span class="go">进入银行侧 &rarr;</span>
      </a>
    </div>
    <div class="foot">本地部署 · 数据不出内网</div>
  </div>
</body>
</html>
