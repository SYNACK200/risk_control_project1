<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · 智能风控</title>
<style>
  :root { --ink:#0f1f33; --muted:#5b6b80; --line:#e3eaf4; --brand:#1d4ed8; --brand-2:#2563eb; color-scheme:light; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; color:var(--ink);
         background:#f7f9fc; display:grid; place-items:center; padding:24px; line-height:1.7; }
  .shell { width:min(940px,100%); background:#fff; border:1px solid var(--line); border-radius:22px;
           display:grid; grid-template-columns:1fr 1fr; overflow:hidden; box-shadow:0 24px 60px rgba(15,31,51,.10); }
  @media (max-width:820px){ .shell { grid-template-columns:1fr; } .aside { display:none; } }
  .aside { background:linear-gradient(150deg,#12233d,#1d3a63); color:#fff; padding:44px 38px; display:flex; flex-direction:column; justify-content:space-between; }
  .aside h2 { margin:0 0 12px; font-size:24px; line-height:1.35; }
  .aside p { margin:0; color:#c4d3e8; font-size:14px; }
  .aside ul { list-style:none; padding:0; margin:26px 0 0; display:grid; gap:12px; font-size:13.5px; color:#dbe6f5; }
  .aside li::before { content:"✓"; color:#5eead4; margin-right:8px; font-weight:700; }
  .aside .tip { font-size:12px; color:#8fa5c2; }

  .form { padding:44px 38px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; margin-bottom:26px; }
  .brand i { width:26px; height:26px; border-radius:7px; display:grid; place-items:center;
             background:linear-gradient(135deg,#2563eb,#1e40af); color:#fff; font-style:normal; font-size:14px; }
  .form h1 { margin:0 0 6px; font-size:22px; }
  .form .sub { margin:0 0 22px; color:var(--muted); font-size:13.5px; }

  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; background:#f1f5fb; padding:5px; border-radius:12px; margin-bottom:20px; }
  .tabs button { border:0; background:transparent; padding:9px 0; border-radius:9px; font-size:14px; font-weight:600;
                 color:var(--muted); cursor:pointer; transition:.15s; font-family:inherit; }
  .tabs button.active { background:#fff; color:var(--brand); box-shadow:0 2px 8px rgba(15,31,51,.08); }

  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input[type=text], input[type=password] {
    width:100%; height:44px; padding:0 14px; border:1px solid var(--line); border-radius:10px;
    font-size:14.5px; font-family:inherit; color:var(--ink); background:#fff; outline:none; transition:.15s;
  }
  input:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
  .field { margin-bottom:16px; }
  .submit { width:100%; height:46px; border:0; border-radius:11px; background:var(--brand); color:#fff;
            font-size:15px; font-weight:600; cursor:pointer; transition:.15s; font-family:inherit; }
  .submit:hover { background:var(--brand-2); }
  .submit:disabled { opacity:.6; cursor:not-allowed; }
  .msg { margin-top:14px; padding:11px 14px; border-radius:10px; font-size:13.5px; display:none; }
  .msg.err { display:block; background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
  .msg.ok  { display:block; background:#ecfdf5; color:#047857; border:1px solid #a7f3d0; }
  .foot { margin-top:20px; font-size:12.5px; color:#8a97a8; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .foot a { color:var(--brand); text-decoration:none; }
</style>
</head>
<body>
<div class="shell">
  <aside class="aside">
    <div>
      <h2>银行流水<br />可信分析平台</h2>
      <p>先判断真假，再算清能力，最后给出可解释的结论。</p>
      <ul>
        <li>真实性五级核验 · 36 检查点</li>
        <li>余额链逐笔复核</li>
        <li>40 项指标 · 口径可查</li>
        <li>模板自动定列 + 三级保底解析</li>
        <li>本地识别，材料不出内网</li>
      </ul>
    </div>
    <p class="tip">识别与评分为辅助判断，最终授信决策由人工负责。</p>
  </aside>

  <div class="form">
    <div class="brand"><i>风</i>智能风控</div>
    <h1>登录</h1>
    <p class="sub">选择你的身份后登录，系统会进入对应的界面。</p>

    <div class="tabs">
      <button type="button" data-role="banker" class="active">银行侧</button>
      <button type="button" data-role="borrower">借款侧</button>
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="username">账号</label>
        <input id="username" name="username" type="text" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="submit" id="submitBtn" type="submit">登录</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="foot">
      <a href="/">← 返回介绍页</a>
      <span id="roleHint">当前身份：银行侧</span>
    </div>
  </div>
</div>

<script>
(function () {
  var role = 'banker';
  var params = new URLSearchParams(location.search);
  var wanted = params.get('role');
  if (wanted === 'borrower' || wanted === 'banker') role = wanted;

  var tabs = document.querySelectorAll('.tabs button');
  var hint = document.getElementById('roleHint');
  var msg = document.getElementById('msg');
  var form = document.getElementById('loginForm');
  var btn = document.getElementById('submitBtn');

  function paint() {
    tabs.forEach(function (b) {
      b.classList.toggle('active', b.dataset.role === role);
    });
    hint.textContent = '当前身份：' + (role === 'banker' ? '银行侧' : '借款侧');
  }
  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      role = b.dataset.role;
      hideMsg();
      paint();
    });
  });
  paint();

  function showMsg(text, ok) {
    msg.textContent = text;
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
  }
  function hideMsg() { msg.className = 'msg'; msg.textContent = ''; }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    hideMsg();
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    if (!username || !password) { showMsg('请输入账号和密码'); return; }
    btn.disabled = true;
    btn.textContent = '登录中…';

    fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    }).then(function (res) {
      return res.json().then(function (body) { return { ok: res.ok, status: res.status, body: body }; });
    }).then(function (r) {
      if (!r.ok) {
        var d = r.body && r.body.detail;
        var text = (d && (d.message || d)) || ('登录失败（' + r.status + '）');
        showMsg(typeof text === 'string' ? text : '登录失败');
        return;
      }
      var token = r.body.token;
      var user = r.body.user || {};
      if (user.role !== role) {
        // 身份选错：不写入登录态，直接提示
        showMsg(role === 'banker'
          ? '这是借款侧账号。请切换到「借款侧」再登录。'
          : '这是银行侧账号。请切换到「银行侧」再登录。');
        return;
      }
      if (user.status === 'disabled') { showMsg('账号已停用，请联系管理员'); return; }
      localStorage.setItem('bs_token', token);
      localStorage.setItem('bs_user', JSON.stringify(user));
      showMsg('登录成功，正在进入…', true);
      location.href = role === 'banker' ? '/bank/' : '/app/';
    }).catch(function (err) {
      showMsg('网络错误：' + err.message);
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = '登录';
    });
  });
})();
</script>
</body>
</html>
